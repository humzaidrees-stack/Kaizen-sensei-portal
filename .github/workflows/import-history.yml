# One-off. Reads Mindbody class rows into class_history. Does not call /api/cron/sync.
name: Import history

on:
  workflow_dispatch:

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Import November and December class rows
        env:
          PREVIEW_URL: https://kaizen-sensei-portal-git-cursor-phase1-schedu-8d286d-kaizenwell.vercel.app/api/cron/import-history
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VERCEL_BYPASS_SECRET: ${{ secrets.VERCEL_BYPASS_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET is not set on this repository."
            exit 1
          fi
          args=(-fsS --retry 2 --retry-delay 5 --max-time 180 -H "Authorization: Bearer ${CRON_SECRET}")
          if [ -n "$VERCEL_BYPASS_SECRET" ]; then
            args+=(-H "x-vercel-protection-bypass: ${VERCEL_BYPASS_SECRET}")
          fi
          curl "${args[@]}" "$PREVIEW_URL"
          echo
